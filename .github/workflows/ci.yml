name: CI

# CI completa: build + tests de backend (JUnit 5 + Mockito para los unitarios,
# Testcontainers para los de integracion) y build + tests de frontend (Vitest).
# Los tests de integracion levantan su propio Postgres via Testcontainers, asi
# que este workflow no declara `services:`: el runner ubuntu-latest ya trae el
# demonio Docker corriendo y es el daemon contra el que Testcontainers opera.
# Agregar un `services: postgres:` seria config muerta (Testcontainers no
# consume los hostnames de los services de Actions salvo que el test los
# declare a mano, y estos usan @ServiceConnection sobre su propio contenedor).

on:
  push:
  pull_request:

jobs:
  backend-build:
    name: Build backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build y test backend
        working-directory: backend
        run: mvn -q verify
        # `verify` corre los 12 tests unitarios (SectionTest, WorkTest) y los
        # 13 de integracion (FotosBackendApplicationTests +
        # PortfolioApiIntegrationTest), que necesitan Docker para su Postgres
        # de Testcontainers. Reemplaza al `mvn -q package -DskipTests` de Epic 0.

  frontend-build:
    name: Build frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm run test -- --watch=false
        # El target `test` de angular.json usa el builder @angular/build:unit-test
        # con el runner Vitest (vitest + jsdom, sin Karma ni karma.conf.js en el
        # repo), asi que los 17 tests corren en Node con jsdom y NO hace falta
        # ningun browser. Por eso no se pasa --browsers=ChromeHeadless: sin
        # `browsers` configurado el builder usa jsdom, y forzarlo exigiria
        # instalar Chrome en el runner. --watch=false evita el modo watch
        # (Angular ya lo desactiva solo en no-TTY, pero explicito es determinista).
