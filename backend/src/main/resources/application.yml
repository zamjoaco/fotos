server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: fotos-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fotos}
    username: ${DB_USERNAME:fotos}
    password: ${DB_PASSWORD:fotos}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

# Admin inicial (ver Epic 4 / auth): un ApplicationRunner crea el primer
# AdminUser leyendo estas variables solo si no existe ninguno todavia.
admin:
  initial-email: ${ADMIN_INITIAL_EMAIL:}
  initial-password: ${ADMIN_INITIAL_PASSWORD:}

# Cliente MinIO como bean condicional (ver Epic 1 / works). Deshabilitado
# por defecto hasta que se implemente el modulo de imagenes.
storage:
  minio:
    enabled: ${STORAGE_MINIO_ENABLED:false}
    endpoint: ${STORAGE_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_MINIO_ACCESS_KEY:}
    secret-key: ${STORAGE_MINIO_SECRET_KEY:}
    bucket: ${STORAGE_MINIO_BUCKET:fotos-works}
